<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default/fallback SEO tags. Every route overrides title/description
         at runtime via the <SEO> component (src/components/SEO.jsx), but
         these matter for the very first paint and for crawlers/share
         previews that don't execute JS. -->
    <title>Budget Basic – Free Student Expense Tracker & Budget Planner</title>
    <meta
      name="description"
      content="Track expenses, plan your budget with the 50-30-20 rule, and build better money habits with Budget Basic — a free, privacy-first expense tracker built for students."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0b0f19" />
    <link rel="canonical" href="https://www.budgetbasic.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Budget Basic" />
    <meta property="og:title" content="Budget Basic – Free Student Expense Tracker & Budget Planner" />
    <meta
      property="og:description"
      content="Track expenses, plan your budget with the 50-30-20 rule, and build better money habits with Budget Basic — a free, privacy-first expense tracker built for students."
    />
    <meta property="og:url" content="https://www.budgetbasic.app/" />
    <meta property="og:image" content="https://www.budgetbasic.app/logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Budget Basic – Free Student Expense Tracker & Budget Planner" />
    <meta
      name="twitter:description"
      content="Track expenses, plan your budget with the 50-30-20 rule, and build better money habits with Budget Basic."
    />
    <meta name="twitter:image" content="https://www.budgetbasic.app/logo.png" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Structured data: helps search engines understand what this site is -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Budget Basic",
        "url": "https://www.budgetbasic.app/",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "description": "A free, privacy-first expense tracker and budgeting education site built for students."
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
